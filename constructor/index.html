<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Constructor modular</title>
<style>
  :root { --panel: rgba(44, 30, 18, .88); --line: #6e4d2c; --txt: #f1e4cc; --on: #c9923f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1224; font: 12px/1.3 system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; left: 8px; top: 8px; width: 236px; max-height: calc(100% - 40px); overflow: auto;
        padding: 6px; background: var(--panel); color: var(--txt); border: 1px solid var(--line); border-radius: 6px; }
  .row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
  .row > span { flex: 1 1 auto; min-width: 0; }
  .row.bar { margin: 6px 0 0; }
  .row.bar > span { flex: 0 0 auto; }
  button { font: inherit; color: var(--txt); background: #4a3321; border: 1px solid var(--line); border-radius: 4px;
           padding: 4px 6px; min-height: 26px; cursor: pointer; }
  button:hover { background: #5d412a; }
  button.on { background: var(--on); color: #2a1b0d; border-color: #e6b765; }
  #ui { display: flex; flex-direction: column; overflow: hidden; }
  #pieces { flex: 1 1 auto; min-height: 90px; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 4px; align-content: start; grid-auto-rows: max-content; }
  #pieces button { display: flex; flex-direction: column; align-items: center; padding: 2px; min-height: 0; line-height: 1.15; background: #4a3321; }
  #pieces img { width: 100%; aspect-ratio: 1; border-radius: 3px; background: #b7c9d1; }
  #pieces b { font-size: 10px; font-weight: 600; }
  #pieces small { font-size: 10px; opacity: .8; }
  #ang, #anc { flex: 1; text-align: center; }
  .row.bar button { flex: 1; min-width: 0; }
  #hint { display: none; position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); padding: 4px 10px; border-radius: 12px; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; pointer-events: none; }
  .heart { position: fixed; color: #ff5a7a; font-size: 22px; pointer-events: none; animation: up 1.3s ease-out forwards; text-shadow: 0 0 4px #000a; }
  @keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }
  #help { position: fixed; left: 8px; bottom: 8px; right: 8px; color: #e6dcc6; text-shadow: 0 0 3px #000; pointer-events: none; }
  @media (max-width: 520px) { #ui { width: 190px; font-size: 11px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="pieces"></div>
  <div class="row bar"><button id="m-build" class="on">Colocar</button><button id="m-del">Eliminar (X)</button></div>
  <div class="row bar"><span>Ajuste (G)</span><button id="s1" class="on">1 m</button><button id="s05">0,5 m</button></div>
  <div class="row bar"><span>Anclaje (Q)</span><button id="ancp">◀</button><span id="anc">1</span><button id="ancn">▶</button></div>
  <div class="row bar"><span>Giro (rueda/R)</span><button id="rot">⟳</button><span id="ang">0°</span></div>
  <div class="row bar"><button id="view">3ª persona</button><button id="zout">−</button><button id="zin">+</button></div>
</div>
<div id="hint">E · acariciar al perrito</div>
<div id="help">WASD mover · Shift correr · Espacio saltar · V vista · E acariciar · Clic: colocar · Rueda: girar pieza · Q: anclaje · Arrastrar: mirar · Ctrl+rueda o +/−: zoom · G ajuste · X eliminar</div>
<script src="dist/app.js"></script>
</body>
</html>
